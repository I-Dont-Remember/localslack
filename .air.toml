#:schema https://json.schemastore.org/any.json
# this avoids BetterTOML warnings in vscode

root = "."
tmp_dir = "tmp"

[build]
stop_on_error = true
cmd = "go build -o ./tmp/localslack ./cmd/localslack"
bin = "./tmp/localslack"
full_bin = "LOCALSLACK_ADDR=:3232 ./tmp/localslack start"
include_ext = ["go", "yaml"]
exclude_dir = ["bin", "tmp", ".git", ".venv", "vendor", "testdata"]
exclude_regex = ["_test.go"]

[log]
time = true
