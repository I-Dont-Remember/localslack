# ---------------------------------------------------------------- behaviors and quirks
# Non-endpoint capabilities. `evidence` is manual here (nothing to derive it from):
# llm = unchecked model knowledge, docs = `ref` cites a source, recorded = `ref` is a fixture.

[behaviors.get-methods-accept-post]
status = "implemented"
summary = "Any method accepts POST (and GET) regardless of the HTTP verb the docs list; the Python SDK always POSTs."
evidence = "docs"
ref = "slack_sdk/web/base_client.py: _perform_urllib_http_request always builds Request(method=\"POST\")"

[behaviors.form-and-json-bodies]
status = "implemented"
summary = "Request params are read from the query string, urlencoded form bodies and JSON bodies (a token field in a JSON body is ignored, as Slack does); arrays become comma lists."
evidence = "docs"
ref = "slack_sdk/web/base_client.py: JSON for chat.postMessage-style methods, urlencoded form for the rest"

[behaviors.api-errors-http-200]
status = "implemented"
summary = "API errors are HTTP 200 with ok:false and an error code, as Slack does."
evidence = "llm"
deviations = ["collapsed-errors"]

[behaviors.opaque-cursor-pagination]
status = "implemented"
summary = "Cursor pagination with response_metadata.next_cursor; cursors are opaque and bound to their endpoint."
evidence = "llm"
deviations = ["cursor-format", "limit-clamping"]

[behaviors.message-ts]
status = "implemented"
summary = "Message ts values are unique and strictly increasing, in Slack's seconds.micros format, across restarts."
evidence = "llm"

[behaviors.slack-style-ids]
status = "implemented"
summary = "Teams, users, channels, DMs and group DMs get Slack-shaped IDs (T/U/C/D/G + 10 chars)."
evidence = "llm"

[behaviors.response-headers]
status = "implemented"
summary = "Slack response headers: x-slack-req-id, x-oauth-scopes (caller grants), x-accepted-oauth-scopes (method scopes) and the Content-Type charset; retry-after only on fault-injected 429s."
evidence = "llm"

[behaviors.multipart-bodies]
status = "planned"
summary = "multipart/form-data requests (file uploads)."
deviations = ["multipart-ignored"]

[behaviors.membership-enforcement]
status = "implemented"
summary = "Strict, scope-gated membership (service/access.go): private channels and DMs are channel_not_found for non-members; a bot not in a public channel gets not_in_channel on history/replies and on post unless its app has chat:write.public (default scopes do); a user token not in a public channel can read but not post; reactions need membership; archived is is_archived on post/update/react/ephemeral. The web UI actor auto-joins a public channel when posting or reacting; registered apps auto-join public channels at registration and after reset."
evidence = "llm"

[behaviors.private-channels]
status = "implemented"
summary = "conversations.create is_private=true makes a private channel (is_private, is_group true); types=private_channel lists only the caller's; the web UI shows a lock icon."
evidence = "llm"

[behaviors.block-kit]
status = "implemented"
summary = "chat.postMessage stores blocks, attachments and message metadata (JSON strings or JSON values), validates their shape (not Block Kit element schemas), and history/replies return them (metadata only with include_all_metadata). The UI renders text only."
evidence = "llm"

[behaviors.rate-limiting]
status = "planned"
milestone = "M5"
summary = "Per-method rate-limit tiers returning HTTP 429 with Retry-After (opt-in via env var)."

[behaviors.oauth-scopes]
status = "planned"
milestone = "M4"
summary = "Per-method scope checks (missing_scope) with a permissive default; full OAuth flow emulation is intentionally low priority."
deviations = ["any-token-accepted"]

[behaviors.events-api-http]
status = "implemented"
summary = "Events API delivery over HTTP to one or more registered apps: url_verification, v0 HMAC signing, per-app event_callback envelopes, retries with X-Slack-Retry-Num/-Reason, X-Slack-No-Retry, and request URL resolution (deliver_to) that refuses remote hosts by default."
evidence = "llm"
deviations = ["event-subset", "permissive-url-verification"]

[behaviors.socket-mode]
status = "implemented"
summary = "Socket Mode: apps.connections.open (xapp- token, one-time ticket URL), WebSocket hello/events_api envelopes/ack/disconnect, round-robin across an app's connections, retries through the shared delivery engine, and /_localslack/socket/{connections,disconnect} controls."
evidence = "llm"
deviations = ["socket-url-local", "socket-events-only"]

[behaviors.inspection-api]
status = "planned"
summary = "LocalSlack-only /_localslack/ endpoints to snapshot, reset and assert on state and API calls, beyond what Slack's own APIs expose."

[behaviors.scenario-seeding]
status = "planned"
summary = "Reproducible workspace scenarios (e.g. 50 channels, 400 users, busy threads) from a flag, config or the inspection API, so tests need no setup boilerplate."

[behaviors.call-log]
status = "implemented"
summary = "Every API call recorded (params, actor, response, timing, fault id) and queryable via /_localslack/calls."
evidence = "llm"

[behaviors.inspector-ui]
status = "implemented"
summary = "Browser inspector at /ui/inspector: live API calls (filters, fault and not-implemented badges), event deliveries (attempts, redeliver), apps (delivery readiness, editable deliver_to, credentials), faults, delivery-config toggles and reset. Socket connections and snapshots/diff panels appear once those backends are wired."
evidence = "llm"

[behaviors.state-reset]
status = "implemented"
summary = "POST /_localslack/reset (and `localslack reset`) reseeds workspace data in one transaction, keeping apps, the team id and ts monotonicity; ?all=true also removes apps."
evidence = "llm"

[behaviors.fault-injection]
status = "implemented"
summary = "Deterministic per-method faults (429 + Retry-After, 5xx, Slack errors, delays) via /_localslack/faults."
evidence = "llm"

[behaviors.app-manifest]
status = "implemented"
summary = "Register multiple apps from Slack app manifests (JSON/YAML) via --app-manifest or /_localslack/apps; each gets a bot user, bot_id and deterministic credentials."
evidence = "llm"

[behaviors.event-delivery-controls]
status = "implemented"
summary = "Test controls for event delivery: inject, redeliver, bad/stale/missing signatures, pause, per-app delivery config and a delivery trace with long-poll."
evidence = "llm"

[behaviors.state-snapshot]
status = "planned"
summary = "Snapshot, restore and diff workspace state; snapshot format doubles as scenario fixture."

# ---------------------------------------------------------------- known deviations
# Referenced by id from methods and behaviors above. Keep summaries one sentence: they are
# published verbatim in docs/COMPATIBILITY.md.

[deviations.any-token-accepted]
severity = "medium"
summary = "Any xoxb- token maps to the bot and xoxp-<userID> to that user; there is no token validation, revocation or scope checking."


[deviations.name-targets-unresolved]
severity = "medium"
summary = "The channel param must be an ID: \"#general\" and user IDs as DM targets return channel_not_found (Slack resolves both)."

[deviations.partial-message-fields]
severity = "medium"
summary = "Messages omit bot_profile, team, app_id, client_msg_id, subtype and reply_users."


[deviations.multipart-ignored]
severity = "medium"
summary = "multipart/form-data bodies are silently ignored, so their params are dropped (usually surfacing as not_authed or no_text)."

[deviations.collapsed-errors]
severity = "low"
summary = "Some distinct Slack errors are merged: unparseable bodies become invalid_arguments, and several methods fold finer-grained failures into one code."

[deviations.partial-conversation-fields]
severity = "low"
summary = "Conversations omit topic, purpose, previous_names, is_shared/is_ext_shared/is_org_shared and updated; IMs include num_members."

[deviations.partial-user-fields]
severity = "low"
summary = "Users carry only id, team_id, name, real_name, deleted, is_bot and a minimal profile."

[deviations.limit-clamping]
severity = "low"
summary = "Invalid or out-of-range limit values are silently clamped (default 100, max 1000) instead of erroring; Slack's defaults and caps vary by method."

[deviations.cursor-format]
severity = "low"
summary = "Cursors are unpadded base64url of an internal key; Slack's are padded base64. Clients should treat both as opaque."

[deviations.tombstone-shape]
severity = "low"
summary = "Deleting a thread root that has replies leaves a tombstone (subtype tombstone, text \"This message was deleted.\") that keeps the original user; Slack's carries different fields (user USLACKBOT, hidden). The shape is unverified against a recording."

[deviations.event-subset]
severity = "medium"
summary = "Only message (channels/groups/im/mpim, incl. message_changed and message_deleted), app_mention and reaction_added events are emitted; other subscriptions are accepted with a warning and never fire (inject them with POST /_localslack/events)."

[deviations.permissive-url-verification]
severity = "low"
summary = "A failed url_verification handshake only marks the app unverified and warns; events are still delivered. The challenge may be echoed as JSON or plain text."

[deviations.ephemeral-not-delivered]
severity = "low"
summary = "chat.postEphemeral validates and remembers the message in a bounded in-memory ring (inspector use) but never delivers it: no history entry, no event, and it is lost on restart."

[deviations.socket-url-local]
severity = "low"
summary = "apps.connections.open returns ws://<this server>/_localslack/socket?ticket=..&app_id=.. instead of a wss://wss-primary.slack.com URL; debug_reconnects is ignored, any registered app can connect (socket_mode_enabled is not required) and the connection count is not capped at 10."

[deviations.socket-events-only]
severity = "medium"
summary = "Socket Mode carries events_api envelopes only; slash_commands and interactive envelopes are never sent, and accepts_response_payload is always false. Hello and disconnect debug_info fields are placeholders."
