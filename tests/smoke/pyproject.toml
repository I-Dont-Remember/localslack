[project]
name = "localslack-smoke"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "slack-sdk",
    "pytest",
    "httpx",
    "playwright>=1.63.0",
    "pytest-playwright>=0.10.0",
]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
python_files = ["*_test.py"]
xfail_strict = true
