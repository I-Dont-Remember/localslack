repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^internal/web/static/htmx\.min\.js$ # vendored, checksum-pinned
      - id: end-of-file-fixer
        exclude: ^internal/web/static/htmx\.min\.js$ # vendored, checksum-pinned
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: ast-grep
        name: ast-grep rules
        entry: bash -c 'ast-grep test && ast-grep scan'
        language: system
        files: '(\.go|\.yml)$'
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-build
        name: go build
        entry: go build ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-test
        name: go test -short
        entry: go test -short -shuffle=on ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy check
        entry: go mod tidy -diff
        language: system
        files: '(\.go|go\.mod|go\.sum)$'
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run --project tests/smoke ruff check tests
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run --project tests/smoke ruff format --check tests
        language: system
        types: [python]
        pass_filenames: false
