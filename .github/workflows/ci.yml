name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2 # installs the tools pinned in mise.toml
      - run: make setup
      - run: uv run --project tests/smoke playwright install-deps chromium
      - run: make verify
