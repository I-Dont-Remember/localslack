version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - misspell
    - nilerr
    - unparam
    - ineffassign
    - gochecknoinits
    - gochecknoglobals
    - noctx
    - errorlint
    - bodyclose
    - thelper
    - paralleltest
    - depguard
  settings:
    depguard:
      rules:
        api:
          files: ["**/internal/api/**", "!$test"]
          deny:
            - pkg: localslack/internal/store
              desc: api talks to service, never store
            - pkg: localslack/internal/web
              desc: api and web must not import each other
        web:
          files: ["**/internal/web/**", "!$test"]
          deny:
            - pkg: localslack/internal/store
              desc: web talks to service, never store
            - pkg: localslack/internal/api
              desc: api and web must not import each other
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-strings
        - name: var-naming
        - name: indent-error-flow
        - name: if-return
        - name: increment-decrement
        - name: range
  exclusions:
    paths:
      - tmp

formatters:
  enable:
    - goimports
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - localslack
    gofumpt:
      module-path: localslack
