version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - misspell
    - nilerr
    - unparam
    - ineffassign
    - gochecknoinits
    - gochecknoglobals
    - noctx
    - errorlint
    - bodyclose
    - thelper
    - paralleltest
    - depguard
  settings:
    depguard:
      rules:
        # Add rules for events, control, scenario, appmanifest when those pkgs
        # land: deny store from all; api -> events/control; events -> api/web.
        api:
          files: ["**/internal/api/**", "!$test"]
          deny:
            - pkg: localslack/internal/store
              desc: api talks to service, never store
            - pkg: localslack/internal/web
              desc: api and web must not import each other
            - pkg: localslack/internal/admin
              desc: api must not import admin
        web:
          files: ["**/internal/web/**", "!$test"]
          deny:
            - pkg: localslack/internal/store
              desc: web talks to service, never store
            - pkg: localslack/internal/api
              desc: api and web must not import each other
            - pkg: localslack/internal/admin
              desc: web must not import admin
        admin:
          files: ["**/internal/admin/**", "!$test"]
          deny:
            - pkg: localslack/internal/store
              desc: admin talks to service, never store
            - pkg: localslack/internal/api
              desc: admin must not import api
            - pkg: localslack/internal/web
              desc: admin must not import web
        leaf:
          files: ["**/internal/calllog/**", "**/internal/faults/**", "!$test"]
          deny:
            - pkg: localslack/internal/store
              desc: leaf packages must not import store
            - pkg: localslack/internal/service
              desc: leaf packages must not import service
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-strings
        - name: var-naming
        - name: indent-error-flow
        - name: if-return
        - name: increment-decrement
        - name: range
  exclusions:
    paths:
      - tmp

formatters:
  enable:
    - goimports
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - localslack
    gofumpt:
      module-path: localslack
