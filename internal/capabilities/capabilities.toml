# LocalSlack capability manifest: the ONE hand-edited inventory of what we support.
#
# Hand-written here: status, tier, scopes, deviations, plan, behaviors.
# Derived (never write these by hand): per-method evidence level (best `source` of its
# conformance fixtures), SDK-called (scan of tests/ for client.<method>(), see derive.go),
# client versions (tests/smoke/uv.lock). `make docs` regenerates docs/COMPATIBILITY.md.
#
# tier/scopes are transcribed from Slack's docs from memory and are UNVERIFIED until a
# recorded fixture or a cited doc says otherwise. tier 0 = special or unset.
#
# Statuses: planned | in_progress | partial | implemented.
#   partial = served, but a high-severity deviation means real apps will notice.
#   in_progress requires `plan = "agent-docs/plans/<file>.md"`: claim work by setting it.
# Rules checked by `go test ./internal/capabilities`: registry parity, valid enums, deviation
# references, plan files exist. See agent-docs/capabilities.md.

